[scooter]
# BLE MAC address of your Ninebot scooter
address = XX:XX:XX:XX:XX:XX

# Scooter model: g3, g30, g2, g65, f2, e, es
model = g3

# Name used for Home Assistant entity IDs (e.g. sensor.ninebot_max_g3_battery)
name = ninebot_max_g3

[mqtt]
broker = 192.168.1.100
port = 1883
user =
password =

[timing]
# Seconds between sensor read cycles (default: 1200 = 20 min)
poll_interval = 1200

# Seconds between BLE scans when scooter is not found
scan_interval = 60

# BLE scan timeout in seconds
scan_timeout = 5.0

# BLE connection timeout in seconds
connect_timeout = 20.0

[ble]
# Keep BLE connection alive between polls (true) or disconnect after each read (false)
# true  = faster polls, but drains scooter battery and blocks other BLE connections
# false = connects only when polling, saves battery, better for long intervals
keep_alive = false

# Seconds to wait before reconnecting after connection loss
reconnect_delay = 30
